<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Contato</title>
    <link rel="stylesheet" href="style.css"> <!-- Seu arquivo CSS -->
</head>
<body>
    <main id="contatos">
        <!-- O formulário agora envolve os elementos e aplica o alinhamento correto -->
        <form action="#" method="POST" class="form-container">
            
            <!-- Campo de Mensagem -->
            

            <label for="nomresobrenome" nome e sobrenome> </label>
            <label= for="email">email</label>
            <input class="input-padrao" type="text"  id="email" required placeholder="seuemail@dominio.com"
             

            <!-- Opções de Contato (Radio Buttons) -->
            <div class="opcoes-contato">
                <label for="radio-telefone">
                    <input="radio" name="contato" value="telefone" id="radio-telefone" required placeholder="(xx) xxxxx-xxxx" Telefone
                 

                <div class="campo-grupo">
                <label for="mensagem">Mensagem:</label>
                <textarea cols="70" rows="10" id="mensagem" name="mensagem" class="input" required></textarea>
            </div>


                <label for="radio-whatsapp">
                    <input type="radio" name="contato" value="whatsapp" id="radio-whatsapp"> WhatsApp
                </label>
            </div>
             <p>como prefere o nosso contato?</p>
             <label for="radio memail"></label>

            <!-- Botão de Enviar --> 
            <input class="Enviar" submit  value="Enviar Formulário">
            
        </form>
    </main>
</body>
</html>
