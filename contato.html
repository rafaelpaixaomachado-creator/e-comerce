<!DOCTYPE html> 
<html lang="pt-BR"> 
<head> 
    <meta charset="UTF-8"> 
    <title>Contato</title>
    <link rel="stylesheet" href="style.css"> <!-- Seu arquivo CSS -->
</head> 
<body> 
    <main id="contatos"> 
        <!-- O formulário agora envolve os elementos e aplica o alinhamento correto -->
        <form action="#" method="POST" class="form-container">
            
            <!-- Campo de Mensagem -->
            <div class="campo-grupo">
                <label for="mensagem">Mensagem:</label> 
                <textarea cols="70" rows="10" id="mensagem" name="mensagem" class="input" required></textarea> 
            </div>

            <!-- Opções de Contato (Radio Buttons) --> 
            <div class="opcoes-contato"> 
                <label for="radio-telefone"> 
                    <input type="radio" name="contato" value="telefone" id="radio-telefone"> Telefone 
                </label> 
                <label for="radio-whatsapp"> 
                    <input type="radio" name="contato" value="whatsapp" id="radio-whatsapp"> WhatsApp 
                </label> 
            </div> 

            <!-- Botão de Enviar --> 
            <input type="submit" value="Enviar Formulário"> 
        </form>
    </main> 
</body> 
</html>
