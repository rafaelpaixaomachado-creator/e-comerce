<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbearia Alura</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="caixa">
            <img src="logo.png" alt="Logo da Barbearia Alura" class="logo-topo">
            <nav class="menu-principal">
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">Produtos</a></li>
                    <li><a href="#">Contato</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main class="caixa">
        <section class="conteudo-principal">
            <h2>Bem-vindo ao nosso site</h2>
            <p class="texto-destaque">Este é um texto em destaque com tamanho menor e negrito.</p>
            <p>Aqui você pode incluir o restante do conteúdo da sua página.</p>
        </section>
        
        <section class="imagens-projeto">
            <div class="imagem-item">
                <img src="beneficios.jpg" alt="Foto de uma barbearia com poltronas e espelho">
            </div>
            <div class="imagem-item">
                <img src="utensilios.jpg" alt="Foto de uma barbearia com um homem fazendo a barba">
                <!-- Frases corrigidas e organizadas em uma lista real -->
                <ul class="lista-servicos">
                    <li><strong>Descrição:</strong> Serviços de alta qualidade</li>
                    <li><strong>Cabelo:</strong> R$ 30,00</li>
                    <li><strong>Barba:</strong> R$ 25,00</li>
                    <li><strong>Cabelo + Barba:</strong> R$ 50,00</li>
                </ul>
            </div>
        </section>
    </main>
</body>
</html>
