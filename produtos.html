<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbearia Alura</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="caixa">
            <img src="logo.png" alt="Logo da Barbearia Alura" class="logo-topo tem uma barba e o nome Alura">
            <nav class="menu-principal">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="produtos.html">Produtos</a></li>
                    <li><a href="contato.html">Contato</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="caixa">
        <section class="conteudo-principal">
            <h2>Bem-vindo ao nosso site</h2>
            <p class="texto-destaque">Este é um texto em destaque com tamanho menor e negrito.</p>
            <p>Aqui você pode incluir o restante do conteúdo da sua página.</p>
        </section>

        <section class="imagens-projeto">
            <!-- Item Cabelo -->
            <div class="imagem-item">
                <img src="cabelo.jpg" alt="Foto de corte de cabelo masculino">
                <p class="servico-item"><strong>Cabelo:</strong> R$ 30,00</p>
            </div>

            <!-- Item Barba -->
            <div class="imagem-item">
                <img src="barba.jpeg" alt=a">
                <p class="servico-item"><strong>Barba:</strong> R$ 25,00</p>
            </div>

            <!-- Item Combo Cabelo + Barba -->
            <div class="imagem-item">
                <img src="barba+cabelo.jpeg" alt="Foto de serviço completo de cabelo e barba">
                <p class="servico-item"><strong>Cabelo + Barba:</strong> R$ 50,00</p>
            </div>
        </section>
    </main>
</body>
</html>
