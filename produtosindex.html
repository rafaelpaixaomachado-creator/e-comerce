<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Minha Loja</title>
    <style>
        /* Reset básico para limpar estilos do navegador */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Fundo da página */
        body {
            background-color: #f4f6f9; /* Cinza bem claro, estilo e-commerce */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* O Cartão onde fica o formulário */
        .container-contato {
            background-color: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08); /* Sombra suave */
        }

        /* Título */
        .container-contato h2 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
            font-size: 28px;
        }

        .container-contato p.subtitulo {
            color: #777;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        /* Estilização dos campos */
        .grupo-input {
            margin-bottom: 20px;
        }

        .grupo-input label {
            display: block;
            margin-bottom: 8px;
            color: #444;
            font-weight: 600;
            font-size: 14px;
        }

        .grupo-input input, 
        .grupo-input textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        /* Efeito quando clica no campo */
        .grupo-input input:focus, 
        .grupo-input textarea:focus {
            border-color: #007bff; /* Azul padrão de lojas */
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }

        /* Estilização do Botão */
        .btn-enviar {
            width: 100%;
            padding: 14px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-enviar:hover {
            background-color: #0056b3; /* Azul mais escuro ao passar o mouse */
        }

        /* Link de voltar */
        .link-voltar {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #007bff;
            text-decoration: none;
            font-size: 14px;
        }

        .link-voltar:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container-contato">
        <h2>Fale Conosco</h2>
        <p class="subtitulo">Preencha o formulário abaixo e responderemos em breve.</p>

        <form action="#" method="POST">
            <div class="grupo-input">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
            </div>

            <div class="grupo-input">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" required>
            </div>

            <div class="grupo-input">
                <label for="assunto">Assunto</label>
                <input type="text" id="assunto" name="assunto" placeholder="Motivo do contato">
            </div>

            <div class="grupo-input">
                <label for="mensagem">Mensagem</label>
                <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva sua mensagem aqui..." required></textarea>
            </div>

            <button type="submit" class="btn-enviar">Enviar Mensagem</button>
        </form>

        <a href="index.html" class="link-voltar">← Voltar para a Loja</a>
    </div>

</body>
</html>
